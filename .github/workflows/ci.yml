name: ci

on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force_red:
        description: Fail ids on purpose and skip openspec, domain, and ui
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ids:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Forced red drill
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.force_red == true || github.event.inputs.force_red == 'true')
        run: exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: One-way door
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo 'sample model diff'
          python3 ios/scripts/check-one-way-door.py --diff-file ios/scripts/testdata/one-way-model.diff
          echo 'sample copy diff'
          python3 ios/scripts/check-one-way-door.py --diff-file ios/scripts/testdata/one-way-copy.diff
          out=$(python3 ios/scripts/check-one-way-door.py --base "origin/$BASE_REF")
          printf '%s\n' "$out"
          first=${out%%$'\n'*}
          if [ "$first" = "one-way door: yes" ]; then
            reason=${out#*$'\n'reason: }
            reason=${reason//$'\n'/ }
            reason=${reason//::/}
            echo "::notice title=One-way door::${reason:0:400}"
          fi
      - name: One-way door unit tests
        run: python3 ios/scripts/test_check_one_way_door.py
      - name: Wired scripts are named in Agents.md
        run: python3 ios/scripts/check-agent-rails.py
      - name: UI test methods are named
        run: python3 ios/scripts/check-ui-test-names.py
      - name: PR text does not link user-attachment hosts
        run: python3 ios/scripts/check-pr-attachments.py
      - name: Added lines that repeat a review finding
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          python3 ios/scripts/check-review-repeats.py --base "origin/$BASE_REF"
      - name: Review-repeat unit tests
        run: python3 ios/scripts/test_check_review_repeats.py
      - name: Agent rails unit tests
        run: python3 ios/scripts/test_check_agent_rails.py
      - name: Every A11yID is named in the feature map
        run: python3 ios/scripts/check-feature-map.py
      - name: Feature map vs UITest coverage
        run: python3 ios/scripts/check-ui-coverage.py --fail-uncovered
      - name: Screen catalog files exist
        run: python3 ios/scripts/check-screen-catalog.py
      - name: Feature sheets live under Cycle/Month/More
        run: python3 ios/scripts/check-feature-layout.py
      - name: Trends and Visit keys stay out of L10n.swift
        run: python3 ios/scripts/check-l10n-layout.py
      - name: Domain owns math; persistence writes logs
        run: python3 ios/scripts/check-domain-boundary.py
      - name: App Store listing
        run: python3 docs/app-store/check-listing.py
      - name: Decision script
        run: python3 .github/scripts/test_main_is_red.py
      - name: UI suite filters
        run: python3 ios/scripts/test_ui_suite.py

  openspec:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && (github.event.inputs.force_red == true || github.event.inputs.force_red == 'true')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Active OpenSpec change deltas are in main specs
        run: python3 ios/scripts/check-openspec-sync.py

  domain:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && (github.event.inputs.force_red == true || github.event.inputs.force_red == 'true')))
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Domain tests
        run: swift test --package-path ios

  ui:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && (github.event.inputs.force_red == true || github.event.inputs.force_red == 'true')))
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SIM_OS: "27.0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Xcode version for the build cache
        id: xcode-ver
        run: echo "hash=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore the UI test build
        id: ui-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/DerivedData/Build
            ios/DerivedData/SourcePackages
            ios/DerivedData/ModuleCache.noindex
            ios/DerivedData/CompilationCache.noindex
            ios/DerivedData/SDKExplicitPrecompiledModules
            ios/DerivedData/SDKStatCaches.noindex
            ios/DerivedData/build-ok
          key: ui-derived-xcode27-v3-${{ steps.xcode-ver.outputs.hash }}-${{ hashFiles('ios/PeriMedi*/**', 'ios/Sources/**', 'ios/PeriMediUITests/**', 'ios/Package.swift', 'ios/Package.resolved') }}
          restore-keys: |
            ui-derived-xcode27-v3-
            ui-derived-xcode27-v2-
            ui-derived-xcode27-
      - name: Drop a prefix-restored build marker
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        run: rm -f ios/DerivedData/build-ok
      - name: UI tests
        env:
          UI_BUILD_CACHE_HIT: ${{ steps.ui-build-cache.outputs.cache-hit }}
          TEST_RUNNER_PERIMEDI_SAMPLE_TAKEN: "1"
          PERIMEDI_UI_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
        run: .grok/skills/verify-perimedi/scripts/control-perimedi verify
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult
          path: ios/DerivedData/PeriMedi.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Prune the UI test build
        if: always() && steps.ui-build-cache.outputs.cache-hit != 'true'
        run: rm -rf ios/DerivedData/Index.noindex ios/DerivedData/Logs ios/DerivedData/TestResults ios/DerivedData/PeriMedi.xcresult ios/DerivedData/build-for-testing.log
      - name: Note a successful build
        id: build-ok
        if: always()
        run: |
          if [[ -f ios/DerivedData/build-ok ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the UI test build
        if: always() && github.event_name != 'pull_request' && steps.ui-build-cache.outputs.cache-hit != 'true' && steps.build-ok.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/DerivedData/Build
            ios/DerivedData/SourcePackages
            ios/DerivedData/ModuleCache.noindex
            ios/DerivedData/CompilationCache.noindex
            ios/DerivedData/SDKExplicitPrecompiledModules
            ios/DerivedData/SDKStatCaches.noindex
            ios/DerivedData/build-ok
          key: ${{ steps.ui-build-cache.outputs.cache-primary-key }}

  full:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SIM_OS: "27.0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Xcode version for the build cache
        id: xcode-ver
        run: echo "hash=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore the UI test build
        id: ui-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/DerivedData/Build
            ios/DerivedData/SourcePackages
            ios/DerivedData/ModuleCache.noindex
            ios/DerivedData/CompilationCache.noindex
            ios/DerivedData/SDKExplicitPrecompiledModules
            ios/DerivedData/SDKStatCaches.noindex
            ios/DerivedData/build-ok
          key: ui-derived-xcode27-v3-${{ steps.xcode-ver.outputs.hash }}-${{ hashFiles('ios/PeriMedi*/**', 'ios/Sources/**', 'ios/PeriMediUITests/**', 'ios/Package.swift', 'ios/Package.resolved') }}
          restore-keys: |
            ui-derived-xcode27-v3-
            ui-derived-xcode27-v2-
            ui-derived-xcode27-
      - name: Drop a prefix-restored build marker
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        run: rm -f ios/DerivedData/build-ok
      - name: UI tests
        env:
          UI_BUILD_CACHE_HIT: ${{ steps.ui-build-cache.outputs.cache-hit }}
          TEST_RUNNER_PERIMEDI_SAMPLE_TAKEN: "1"
          PERIMEDI_UI_SUITE: full
        run: .grok/skills/verify-perimedi/scripts/control-perimedi verify
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-full-xcresult
          path: ios/DerivedData/PeriMedi.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Prune the UI test build
        if: always() && steps.ui-build-cache.outputs.cache-hit != 'true'
        run: rm -rf ios/DerivedData/Index.noindex ios/DerivedData/Logs ios/DerivedData/TestResults ios/DerivedData/PeriMedi.xcresult ios/DerivedData/build-for-testing.log
      - name: Note a successful build
        id: build-ok
        if: always()
        run: |
          if [[ -f ios/DerivedData/build-ok ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the UI test build
        if: always() && steps.ui-build-cache.outputs.cache-hit != 'true' && steps.build-ok.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/DerivedData/Build
            ios/DerivedData/SourcePackages
            ios/DerivedData/ModuleCache.noindex
            ios/DerivedData/CompilationCache.noindex
            ios/DerivedData/SDKExplicitPrecompiledModules
            ios/DerivedData/SDKStatCaches.noindex
            ios/DerivedData/build-ok
          key: ${{ steps.ui-build-cache.outputs.cache-primary-key }}

  main-status:
    needs: [ids, openspec, domain, ui]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fetch the decision script
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/main_is_red.py \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/scripts/main_is_red.py"
      - name: Apply the main is red decision
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_IDS: ${{ needs.ids.result }}
          MAIN_OPENSPEC: ${{ needs.openspec.result }}
          MAIN_DOMAIN: ${{ needs.domain.result }}
          MAIN_UI: ${{ needs.ui.result }}
          FORCE_RED: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.force_red == true || github.event.inputs.force_red == 'true')) && 'true' || 'false' }}
          MAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 /tmp/main_is_red.py
