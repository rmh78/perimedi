name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every A11yID is named in the feature map
        run: python3 ios/scripts/check-feature-map.py
      - name: Feature map vs UITest coverage (advisory)
        run: python3 ios/scripts/check-ui-coverage.py

  domain:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Domain tests
        run: swift test --package-path ios
